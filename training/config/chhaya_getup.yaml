# Get-up / fall-recovery training: Chhaya + SAC + BAM servo model (envs/isaaclab/getup_env.py).
# The sim2real recipe is the walking one that transferred (config_gait_reference.yaml, run gaitref_resume_2026-10-28):
# same servo model, backlash, sensor model, delays, DR and DR curriculum, CAPS, history, symmetry augmentation. Only
# the task differs (start states, rewards, terminations, action range). Differences kept on purpose are marked "GETUP:".
#
# Hardware protocol this is trained for: walking faults at 45 deg tilt -> servo torque OFF -> the robot falls limp ->
# the Jetson waits for the settle criterion (getup.settle) -> re-arms at the CURRENT pose -> runs this policy -> when
# the success criterion holds (getup.stand_*, success_hold_s) it hands back to walking (arming ramp to the walk home).
#
# Run (from training/, Isaac Lab python):
#   1. Fall bank (once, and again after any change to the robot, the joint box or getup.settle):
#        python src/isaaclab/make_fall_bank.py --config_path config/chhaya_getup.yaml --headless
#      -> data_getup/fall_bank.npz (train + held-out gate split, mirror-complete)
#   2. Train:
#        python -m src.isaaclab.train --task ChhayaGetUp --config_path config/chhaya_getup.yaml --headless
#      -> runs_getup/ (TensorBoard), checkpoints_getup/<run>/
#   3. Watch:  python -m src.isaaclab.play --task ChhayaGetUp --checkpoint checkpoints_getup/<run>/step_N.pt
#              [--start_category supine|prone|left_side|right_side|upright|inverted]
#   4. Export: python -m src.isaaclab.export_onnx --checkpoint checkpoints_getup/<run>/step_N.pt   -> exported_getup/
#   5. Gate:   python src/mujoco/getup_gate.py --bundle exported_getup/<name> --walk_bundle exported/<walk bundle>
#
# Watch in TensorBoard:
#   Diagnostics/getup_success_rate (+ _<category>; success = the Jetson hand-off test held 0.5 s, pose included; in
#   training it ENDS the episode: Episode_Termination/success, shorter train/episode_length),
#   Diagnostics/mean_height_frac (episode-mean h_hat: should climb toward ~0.8+; flat at ~0.55 = parked in a squat,
#   run 2026-11-02_11-45-46), Diagnostics/getup_rise_rate (height/tilt/feet only: what the assist curriculum decays on,
#   as in HoST),
#   Diagnostics/stand_pose_err_deg/* and stand_foot_roll_deg (posture once up: should fall toward ~0-5 deg; a rise is
#   the drift that killed run 2026-11-01_18-59-35), Diagnostics/handoff_ok_frac,
#   Diagnostics/time_to_stand_s, Curriculum/assist_force_frac (should
#   decay to 0: the policy only counts as done once it stands up with NO help), Diagnostics/standing_start_success_rate
#   (~1: standing starts must stay up), Diagnostics/servo_overload_peak, Diagnostics/joint_at_limit_frac/* (a joint
#   living on its box edge wants more range: widening it is a hardware decision), Diagnostics/base_impact_peak_n,
#   Torque/frac_saturated, Reward_Terms/* (reward-budget check at ~5M steps before tuning anything).

train:
  seed: 42
  steps: 500000
  worker_groups: 1
  workers_per_group: 1
  use_history: True
  history_size: 5
  normalize_obs: True
  symmetry_augmentation: True
  actor_obs: "normal"
  critic_obs: "privileged"
  use_rough_terrain: false           # GETUP: the fall bank is flat-ground (the env refuses rough terrain)
  use_terrain_curriculum: false
  log_dir: "runs_getup"              # GETUP: separate output trees (runs_getup/, checkpoints_getup/, exported_getup/)
  checkpoint_path: "checkpoints_getup/"
  model_name: "BipedV2_SAC_getup"
  overwrite_model: true
  model: "sac"

  test_environment: False
  epoch_steps: 1000
  save_steps: 3000
  test_episodes: 2
  show_progress: true
  replace_checkpoint: true
  caps_temporal_weight: 1.0
  caps_spatial_weight: 1.0
  caps_spatial_sigma: 0.1
  symmetry_loss_weight: 0.0
  # GETUP: false. An exactly equivariant actor must answer a mirror-symmetric state (flat on the back or the front) with
  # a mirror-symmetric action, so it cannot pick a side to roll to; it would have to amplify sensor noise. Symmetry
  # augmentation (above: mirrored replay, symmetric normaliser stats, mirror-complete fall bank) keeps the policy
  # mostly symmetric while letting it break symmetry. The MuJoCo gate reports the left/right success difference.
  equivariant_actor: false

  env_config:
    reward_scale: 1.0
    # GETUP: get-up terms only (envs/isaaclab/getup_env.GETUP_REWARD_TERMS; any other nonzero key raises).
    # Budget: lying ~0.25/step (upright), squatting at h_hat 0.55 ~2.4, run 1's crouch ~3.5 and wide edge stance ~4.5
    # (scored on its MuJoCo get-ups), standing at the home pose on flat soles 8.0, so the fastest safe get-up into the home pose wins.
    # NO POSTURE PENALTIES (2026-11-02): pose and sole flatness only scale the non-negative stand bonuses, so rising
    # never lowers the reward, whatever the pose. Run 2026-11-02_11-45-46 had getup_pose_l2 -1 and foot_flat_l1 -2
    # gated in from h_hat 0.6: the joints are far from home during the climb, the climb scored ~0.7/step against a
    # squat's 2.4, and it squatted at h_hat ~0.55 for 233M steps (getup_rise_rate 0, assist stuck at 0.6).
    reward_weights:
      getup_upright: 1.0            # ((up + 1) / 2)^2: righting, gradient from every pose
      getup_height: 2.0             # h_hat * (up + 1) / 2: rising, only while upright
      getup_feet_support: 0.5       # once up > 0.7: on the feet, not the knees
      getup_stand: 3.0              # SOFT stand score (getup.stand_*) * pose quality (getup.pose_*): the hand-off pose
      getup_feet_flat: 1.5          # stand score * exp(-sum |sin(sole roll)| / getup.foot_flat_sigma): flat soles
      getup_still: -1.0             # stand score * pose quality * (|v|^2 + 0.1 |w|^2 + 0.01 |qd|^2)
      # SUCCESS IS THE GOAL (2026-11-04, getup.terminate_on_success): on the hand-off the episode terminates with this
      # reward = the value of standing at home on flat soles forever, (1 + 2 + 0.5 + 3 + 1.5) x gamma / (1 - gamma)
      # = 8.0 x 0.99 / 0.01 (tests/test_getup_rewards.py keeps it in sync). Runs 11-01 and 11-04 got up, then drifted
      # over the ~7 s hold into a wide, low A-frame (soles 200-250 mm apart), even from standing starts at home.
      getup_success: 792.0
      servo_overload: -1.0          # STS3215 overload-protection proxy (leaky integral above 70% of the stall torque)
      body_impact: -0.05            # base contact force above 2 m g (the Jetson / IMU live in the base)
      ang_vel_limit: -0.1           # base rate above 4 rad/s
      self_contact_l2: -0.1         # leg on leg (floor removed), saturating at 5 N
      action_rate_l2: -0.005        # scheduled (action_rate_weight_* below)
      dof_torques_l2: -2.0e-4
      dof_acc_l2: -5.0e-7
      dof_pos_limits: -1.0

    getup:
      bank_path: data_getup/fall_bank.npz
      bank_split: train
      start_mix: {bank: 0.85, standing: 0.15}
      start_category: null
      spawn_clearance_m: 0.002
      stand_height_frac: 0.9
      stand_tilt_deg: 15.0
      success_hold_s: 0.5
      terminate_on_success: true    # training only; play / eval keep running (env_config)
      # pose quality 0.5 exp(-E / sharp) + 0.5 exp(-E / broad), E = |q - home|^2 [rad^2]: sharp pulls into the hand-off
      # box, broad keeps a gradient from far stances (run 1: E ~1.1 standing wide, ~4.4 crouched)
      pose_sharp_rad2: 0.25
      pose_broad_rad2: 2.0
      foot_flat_sigma: 0.35         # roll on both soles: 2 deg -> quality 0.82, 5 deg -> 0.61, 20 deg -> 0.14
      stand_soft_height_frac: 0.7   # stand score ramps from here (and stand_soft_tilt_deg) up to the stand thresholds
      stand_soft_tilt_deg: 30.0
      h_floor_m: null               # null = the bank's median lying base height
      feet_support_min_up: 0.7
      overload_threshold_frac: 0.7
      overload_leak_s: 1.0
      stall_torque_nm: 2.94         # = actuator.stall_torque_cap_nm
      impact_weight_mult: 2.0
      ang_vel_limit_rads: 4.0
      self_contact_thresh_n: 0.5
      self_contact_sat_n: 5.0
      assist: {enabled: true, start_frac: 0.6, step_frac: 0.05, min_frac: 0.0, success_threshold: 0.7,
               update_steps: 250, min_episodes: 256, height_frac: 0.75, min_up: 0.5}
      settle: {gyro_rads: 0.3, joint_vel_rads: 0.5, lin_vel_ms: 0.05, hold_s: 0.3, min_s: 0.5, max_s: 4.0}
      # hand-off to walking in Jetson-measurable terms (tilt, gyro, joint pose; no foot sensors on the robot)
      handoff: {tilt_max_deg: 15.0, gyro_max_rads: 0.5, joint_err_max_rad: 0.2, hold_s: 0.5}
      episode_s: 10.0

    # GETUP: the joint box = URDF limits x 0.9 (user decision 2026-11-01), the knee keeping its +5 deg hyperextension
    # stop. Wider than walking on hip_roll (+81 vs +45), hip_pitch (+81 vs +30), ankle_roll (+-72 vs +-60) and ankle_pitch
    # (+76.5 vs +50); NARROWER on hip_yaw (+-40.5 vs +-45), knee (-108 vs -120) and the negative hip_roll / ankle_pitch
    # sides (-22.5 vs -25, -31.5 vs -35). It is the action clamp, the dof_pos_limits box and the bundle's joint limits.
    joint_limits_deg:
      hip_yaw: [-40.5, 40.5]
      hip_roll: [-22.5, 81.0]
      hip_pitch: [-81.0, 81.0]
      knee: [-108.0, 5.0]
      ankle_roll: [-72.0, 72.0]
      ankle_pitch: [-31.5, 76.5]

    # GETUP: residual map around the DEPLOYED walking policy's home (run gaitref_resume_2026-10-28_08-00-32, frozen
    # values), so a = 0 is the hand-off pose; `box` scales make a = +-1 reach the joint box edges above
    # (utils/residual_action.box_scale_cfg; train.py freezes the numbers into the run config).
    action_map: residual
    action_home_deg: {hip_yaw: 0.7, hip_roll: -2.7, hip_pitch: -8.2, knee: -21.7, ankle_roll: 2.8, ankle_pitch: -13.5}
    action_scale_rad: box
    spawn_height_m: 0.2861          # the walking run's frozen spawn (FK of this home, sole 5.4 mm above the floor)
    spawn_clearance_m: 0.0054

    # ---- sensor model: identical to config_gait_reference.yaml ----------------------------------------------------
    observation_noise_std:
      imu_acc: 0.15
      gyro: 0.02
      projected_gravity: 0.01
      commands: 0.0
      joint_pos: 0.0015
      joint_vel: 0.25
      previous_actions: 0.0
      gait_clock: 0.0
    observation_vibration_std:
      imu_acc: 2.0
      gyro: 1.2
      joint_vel: 0.8
    observation_vibration_hz: [3.0, 20.0]
    observation_vibration_amp_range: [0.3, 1.0]
    quantize_joint_obs: true
    action_noise_model:
      mean: 0.0
      std: 0.01
    action_delay_steps_range: [0, 2]
    servo_obs_delay_steps: 0
    imu_obs_delay_steps_range: [0, 1]
    imu_accel_bias: 0.2
    imu_gyro_bias: 0.02
    mount_offset_rad: 0.0175
    imu_misalignment_deg: 4.0

    # ---- servo model + backlash: identical to config_gait_reference.yaml ------------------------------------------
    actuator:
      params_file: actuator/params/sts3215_12v/m6.json
      kp_fw: 32
      kp_fw_range: [20, 34]
      vin_range: [10.2, 12.6]       # the supply sags most in exactly the high-torque moves a get-up makes
      friction_scale_range: [0.8, 1.2]
      torque_scale: 1.0
      stall_torque_cap_nm: 2.94
      tau_ext_source: observer
      deadband_counts: 1
      deadband_counts_range: [1, 1]
    backlash:
      enabled: true
      lash_deg_range: [1.0, 2.5]
      encoder_side: output
      mujoco_lash_deg: 1.5
      impulse_cap: 2.94

    # ---- schedules -----------------------------------------------------------------------------------------------
    # GETUP: action_rate starts lower (-0.005) than walking (-0.01): HumanUP's easy-to-hard regularisation, the
    # discovery phase needs fast moves. Same end value as walking.
    action_rate_weight_start: -0.005
    action_rate_weight_end: -0.05
    action_rate_ramp_steps: 30000

    # ---- domain randomisation: identical to config_gait_reference.yaml (friction now matters for every body that
    # touches the floor, not just the soles: the range covers plastic shell on hardwood / tape) --------------------
    enable_perturbations: true
    enable_physics_randomization: true
    events:
      randomize_friction:
        params:
          static_friction_range: [0.25, 0.8]
          dynamic_friction_range: [0.2, 0.7]
    mujoco_ground_friction: 0.35

    curriculum_enabled: true
    curriculum_dr_start_steps: 0
    curriculum_dr_full_steps: 10000
    curriculum_cmd_ramp_steps: 0
    curriculum_init_ramp_steps: 0
    curriculum_dr_events: ["randomize_com", "randomize_payload", "action_delay", "servo_stiffness"]

model:
  actor_config:
    network_type: mlp
    hidden_sizes: [1024, 512, 256]
  critic_config:
    network_type: mlp
    hidden_sizes: [1024, 512, 256]

  target_coeff: 0.01
  actor_lr: 3.0e-4
  critic_lr: 3.0e-4
  lr_scheduler:
    scheduler_type: "none"

exploration:
  scale: 0.3
  min_scale: 0.05
  decay_rate: 1.0e-7
  start_steps: 4096

buffer:
  size: 1000000
  return_steps: 5
  batch_iterations: 10
  batch_size: 2048
  discount_factor: 0.99
  steps_before_batches: 4096
  steps_between_batches: 4
  seed: 42
