# chhaya_getup.yaml -- get-up / fall recovery for Chhaya: one whole-body policy (20 joints) that stands the robot
# up from a fall (--task ChhayaGetUp, envs/isaaclab/getup_env.py). Built from chhaya.yaml (same servo model,
# backlash, sensor model, delays and randomization, the arms block with control: policy) plus the get-up changes:
# fall-bank starts (src/isaaclab/make_fall_bank.py), get-up rewards, time-out-only episodes, the joint box
# joint_limits_deg = URDF x 0.9, action_scale_rad: box around the walking home, no equivariant actor, flat ground.
# The arm reward terms of the walking config are off: the arms are free to push the robot up.
#   python src/isaaclab/make_fall_bank.py --config_path config/chhaya_getup.yaml --headless
#   python src/isaaclab/train.py --task ChhayaGetUp --config_path config/chhaya_getup.yaml --headless
train:
  seed: 42
  steps: 500000
  worker_groups: 1
  workers_per_group: 1
  use_history: true
  history_size: 5
  normalize_obs: true
  symmetry_augmentation: true
  actor_obs: normal
  critic_obs: privileged
  use_rough_terrain: false
  use_terrain_curriculum: false
  log_dir: runs_getup
  checkpoint_path: checkpoints_getup/
  model_name: Chhaya_SAC_getup
  overwrite_model: true
  model: sac
  test_environment: false
  epoch_steps: 1000
  save_steps: 3000
  test_episodes: 2
  show_progress: true
  replace_checkpoint: true
  caps_temporal_weight: 1.0
  caps_spatial_weight: 1.0
  caps_spatial_sigma: 0.1
  equivariant_actor: false
  symmetry_loss_weight: 0.0
  env_config:
    arms:
      enabled: true
      control: policy
      action_scale_rad:
        shoulder_pitch: 1.0
        shoulder_roll: 0.6
        arm_yaw: 0.8
        elbow: 1.0
      arm_motion:
        mode_probs:
          rest: 0.3
          swing: 0.3
          random: 0.25
          hold: 0.15
        rest_offset_rad: 0.12
        swing_amp_range:
        - 0.1
        - 0.6
        random_bandwidth_hz:
        - 0.3
        - 1.5
        random_amplitude: 0.7
        hold_period_s:
        - 1.0
        - 3.0
        max_speed_rad_s: 4.0
      mass_scale_range:
      - 0.9
      - 1.1
      mujoco_arm_mode: rest
    reward_scale: 1.0
    reward_weights:
      getup_upright: 1.0
      getup_height: 2.0
      getup_feet_support: 0.5
      getup_stand: 3.0
      getup_feet_flat: 1.5
      getup_still: -1.0
      getup_success: 792.0
      servo_overload: -1.0
      body_impact: -0.05
      ang_vel_limit: -0.1
      self_contact_l2: -0.1
      action_rate_l2: -0.005
      dof_torques_l2: -0.0002
      dof_acc_l2: -5.0e-07
      dof_pos_limits: -1.0
    observation_noise_std:
      imu_acc: 0.15
      gyro: 0.02
      projected_gravity: 0.01
      commands: 0.0
      joint_pos: 0.0015
      joint_vel: 0.25
      previous_actions: 0.0
      gait_clock: 0.0
    observation_vibration_std:
      imu_acc: 2.0
      gyro: 1.2
      joint_vel: 0.8
    observation_vibration_hz:
    - 3.0
    - 20.0
    observation_vibration_amp_range:
    - 0.3
    - 1.0
    quantize_joint_obs: true
    action_noise_model:
      mean: 0.0
      std: 0.01
    action_delay_steps_range:
    - 0
    - 2
    action_rate_limit: 0
    servo_obs_delay_steps: 0
    imu_obs_delay_steps_range:
    - 0
    - 1
    imu_accel_bias: 0.2
    imu_gyro_bias: 0.02
    mount_offset_rad: 0.0175
    imu_misalignment_deg: 3.0
    actuator:
      params_file: actuator/params/sts3215_12v/m6.json
      kp_fw: 32
      kp_fw_range:
      - 20
      - 34
      vin_range:
      - 10.2
      - 12.6
      friction_scale_range:
      - 0.8
      - 1.2
      torque_scale: 1.0
      stall_torque_cap_nm: 2.94
      tau_ext_source: observer
      deadband_counts: 1
      deadband_counts_range:
      - 1
      - 1
    backlash:
      enabled: true
      lash_deg_range:
      - 1.0
      - 2.5
      encoder_side: output
      mujoco_lash_deg: 1.5
      impulse_cap: 2.94
    action_map: residual
    action_home_deg:
      hip_yaw: 0.0
      hip_roll: 0.0
      hip_pitch: -10.0
      knee: -26.0
      ankle_roll: 0.0
      ankle_pitch: -16.0
    action_scale_rad: box
    spawn_height_m: 0.286
    action_rate_weight_start: -0.005
    action_rate_weight_end: -0.05
    action_rate_ramp_steps: 30000
    enable_perturbations: true
    enable_physics_randomization: true
    events:
      randomize_friction:
        params:
          static_friction_range:
          - 0.25
          - 0.8
          dynamic_friction_range:
          - 0.2
          - 0.7
    mujoco_ground_friction: 0.35
    curriculum_enabled: true
    curriculum_dr_start_steps: 0
    curriculum_dr_full_steps: 20000
    curriculum_cmd_ramp_steps: 0
    curriculum_init_ramp_steps: 0
    curriculum_dr_events:
    - randomize_com
    - randomize_payload
    - action_delay
    - servo_stiffness
    curriculum_dr_payload_min: -0.05
    curriculum_dr_payload_max: 0.15
    getup:
      bank_path: data_getup/fall_bank.npz
      bank_split: train
      start_mix:
        bank: 0.85
        standing: 0.15
      start_category: prone      # face-down first (HoST: one policy per start side); supine later
      spawn_clearance_m: 0.002
      stand_height_frac: 0.9
      stand_tilt_deg: 15.0
      success_hold_s: 0.5
      terminate_on_success: true
      pose_sharp_rad2: 0.25
      pose_broad_rad2: 2.0
      foot_flat_sigma: 0.35
      stand_soft_height_frac: 0.7
      stand_soft_tilt_deg: 30.0
      h_floor_m: null
      feet_support_min_up: 0.7
      overload_threshold_frac: 0.7
      overload_leak_s: 1.0
      stall_torque_nm: 2.94
      impact_weight_mult: 2.0
      ang_vel_limit_rads: 4.0
      self_contact_thresh_n: 0.5
      self_contact_sat_n: 5.0
      assist:
        enabled: true
        start_frac: 0.6
        step_frac: 0.05
        min_frac: 0.0
        success_threshold: 0.7
        update_steps: 250
        min_episodes: 256
        height_frac: 0.75
        min_up: 0.5
      settle:
        gyro_rads: 0.3
        joint_vel_rads: 0.5
        lin_vel_ms: 0.05
        hold_s: 0.3
        min_s: 0.5
        max_s: 4.0
      handoff:
        tilt_max_deg: 15.0
        gyro_max_rads: 0.5
        joint_err_max_rad: 0.2
        hold_s: 0.5
      episode_s: 10.0
    joint_limits_deg:
      hip_yaw:
      - -40.5
      - 40.5
      hip_roll:
      - -22.5
      - 81.0
      hip_pitch:
      - -81.0
      - 81.0
      knee:
      - -108.0
      - 5.0
      ankle_roll:
      - -72.0
      - 72.0
      ankle_pitch:
      - -31.5
      - 76.5
model:
  actor_config:
    network_type: mlp
    hidden_sizes:
    - 1024
    - 512
    - 256
  critic_config:
    network_type: mlp
    hidden_sizes:
    - 1024
    - 512
    - 256
  target_coeff: 0.01
  actor_lr: 0.0003
  critic_lr: 0.0003
  lr_scheduler:
    scheduler_type: none
exploration:
  scale: 0.3
  min_scale: 0.05
  decay_rate: 1.0e-07
  start_steps: 4096
buffer:
  size: 200000    # ~0.7 GB on the GPU: 1M (3.5 GB) overflowed a 6 GB laptop card
  return_steps: 5
  batch_iterations: 10
  batch_size: 2048
  discount_factor: 0.99
  steps_before_batches: 4096
  steps_between_batches: 4
  seed: 42
